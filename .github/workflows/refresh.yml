name: Weekly Qlik Data Refresh

on:
  schedule:
    # Every Monday at 07:00 UTC (09:00 Amsterdam time, after Qlik weekend reload)
    - cron: '0 7 * * 1'
  workflow_dispatch:   # allows manual "Run workflow" from GitHub UI

permissions:
  contents: write      # needed to commit the updated JSON back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install websockets openpyxl

      - name: Fetch fresh data from Qlik
        env:
          QLIK_TENANT:   ${{ secrets.QLIK_TENANT }}
          QLIK_API_KEY:  ${{ secrets.QLIK_API_KEY }}
          QLIK_APP_ID:   ${{ secrets.QLIK_APP_ID }}
          START_DATE:    '2025-01-01'
        run: python fetch_qlik_data.py --json --out data

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/qlik_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly Qlik data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
