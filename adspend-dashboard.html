<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adspend Decision Dashboard</title>
<style>
:root{
  --bg:#f5f6f9;--card:#fff;--ink:#18202e;--mute:#5d6878;--line:#e2e6ed;--head:#f0f2f6;--accent:#2f5bea;--sel:#eaf0ff;
  --g-bg:#d9f3e3;--g-fg:#0f6537;
  --a1-bg:#fdf1cd;--a1-fg:#80560a;
  --a2-bg:#f9cf94;--a2-fg:#6e3200;
  --r-bg:#fbdcdb;--r-fg:#9d1a1d;
  --n-bg:#e7eaf0;--n-fg:#566173;
  --b-bg:#dce8ff;--b-fg:#1c4aaf;
  --stripe:#edf0f6;--sep:#000;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141b;--card:#181e28;--ink:#e6eaf2;--mute:#9aa5b6;--line:#2a3342;--head:#1e2531;--accent:#6e90ff;--sel:#222c42;
    --g-bg:#14412a;--g-fg:#7de0a5;
    --a1-bg:#463a12;--a1-fg:#f2d27a;
    --a2-bg:#6a3d10;--a2-fg:#ffc98a;
    --r-bg:#4d1d1f;--r-fg:#ff9fa1;
    --n-bg:#2a3240;--n-fg:#a5b0c2;
    --b-bg:#1f3158;--b-fg:#9db9ff;
    --stripe:#212a3a;--sep:#e6eaf2;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:none;margin:0 auto;padding:12px 6px}
h1{font-size:19px;margin:0}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
h2{font-size:15px;margin:0 0 8px}
h3{font-size:13px;margin:14px 0 6px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.uploads{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.up{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mute)}
.up input{font-size:12px;max-width:230px}
.up .fn{color:var(--ink);font-size:11px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);min-height:78px}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mute);margin-top:2px}
.kpi.g{border-left:4px solid var(--g-fg)}.kpi.a1,.kpi.a2{border-left:4px solid var(--a2-fg)}.kpi.r{border-left:4px solid var(--r-fg)}.kpi.n{border-left:4px solid var(--n-fg)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card)}
.seg button.on{background:var(--accent);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;font-size:13px;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:600;font-size:11.5px;line-height:1.2;white-space:normal;vertical-align:bottom;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th.sorted{color:var(--accent)}
th.l,td.l{text-align:left}
td{background:var(--card)}
tbody tr:nth-child(even) td{background:var(--stripe)}
td.l:first-child,th.l:first-child{position:sticky;left:0;z-index:1}
th.l:first-child{background:var(--head);z-index:3}
tbody tr.total td{background:var(--head);font-weight:600;border-bottom:2px solid var(--mute)}
tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sel)}
tbody tr.sel td{background:var(--sel)}
.vsep{border-left:2px solid var(--sep)!important}
.cw{position:relative;display:inline-block}
.cw .bdg{position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:6px;white-space:nowrap}
.bdg .badge{margin:0}.bdg .badge+.badge{margin-left:3px}
.sub{font-size:10.5px;color:var(--mute);white-space:normal;max-width:150px;text-align:left}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;cursor:help}
.chip.g{background:var(--g-bg);color:var(--g-fg)}
.chip.a1{background:var(--a1-bg);color:var(--a1-fg)}
.chip.a2{background:var(--a2-bg);color:var(--a2-fg)}
.chip.r{background:var(--r-bg);color:var(--r-fg)}
.chip.n{background:var(--n-bg);color:var(--n-fg)}
.chip.b{background:var(--b-bg);color:var(--b-fg)}
.badge{display:inline-block;margin-left:4px;padding:0 5px;border-radius:4px;font-size:10px;background:var(--n-bg);color:var(--n-fg);cursor:help;vertical-align:1px}
.t-g{color:var(--g-fg);font-weight:600}.t-a1,.t-a2{color:var(--a2-fg);font-weight:600}.t-r{color:var(--r-fg);font-weight:600}
.dec{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--n-fg)}
.dec.inc .dot{background:var(--g-fg)}.dec.cau .dot{background:#d99a00}.dec.hold .dot{background:var(--b-fg)}.dec.red .dot{background:var(--r-fg)}
.wow{font-size:10.5px;margin-left:4px;cursor:help}.wow.up{color:var(--g-fg)}.wow.dn{color:var(--r-fg)}.wow.flat{color:var(--mute)}
.mute{color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.note{padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px;background:var(--a1-bg);color:var(--a1-fg)}
.note.info{background:var(--b-bg);color:var(--b-fg)}
.note.err{background:var(--r-bg);color:var(--r-fg)}
.note.ok{background:var(--g-bg);color:var(--g-fg)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
input[type=number],input[type=date],select,textarea{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;background:var(--card);color:var(--ink)}
input[type=number]{width:74px;text-align:right}
input.wide{width:92px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tbl-sm td,.tbl-sm th{padding:4px 6px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 18px}
.plist label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
ul.v{margin:0;padding-left:0;list-style:none}
ul.v li{padding:5px 0 5px 22px;position:relative;border-bottom:1px solid var(--line);font-size:12.5px}
ul.v li:before{content:"•";position:absolute;left:6px}
ul.v li.warn:before{content:"⚠";color:var(--a2-fg)}
ul.v li.ok:before{content:"✓";color:var(--g-fg)}
ul.v li.err:before{content:"✕";color:var(--r-fg)}
#tip{position:fixed;z-index:50;max-width:340px;background:#0f1522;color:#eef2fa;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:6px;pointer-events:none;white-space:pre-line;display:none;box-shadow:0 4px 18px rgba(0,0,0,.3)}
@media (max-width:640px){.wrap{padding:12px 8px}.kpi .v{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Adspend Decision Dashboard<small>FPROAS-to-target + spend pacing, by country × user type</small></h1>
    <div class="uploads">
      <label class="up">Premium User Data (CSV / XLSX)<input type="file" id="f-prem" accept=".csv,.txt,.xlsx,.xls,.xlsm"><span class="fn" id="fn-prem">no file</span></label>
      <label class="up">Adspend Data (CSV / XLSX)<input type="file" id="f-ad" accept=".csv,.txt,.xlsx,.xls,.xlsm"><span class="fn" id="fn-ad">no file</span></label>
      <label class="up">LTV table (optional XLSX)<input type="file" id="f-ltv" accept=".xlsx,.xls"><span class="fn" id="fn-ltv">built-in · as of 5 Aug 2026</span></label>
      <button id="btn-demo" data-tip="Generates synthetic premium + adspend data and a placeholder budget so you can try the dashboard. Replaced as soon as you upload real files.">Load demo data</button>
      <button id="btn-qlik" class="primary" data-tip="Load the latest data file fetched from Qlik (data/qlik_data.json). Updated weekly by the scheduled job.">↻ Load Qlik data</button>
      <button id="btn-refresh" style="display:none" data-tip="Trigger an on-demand Qlik pull. This calls a serverless function which connects to Qlik, fetches fresh data, and reloads the dashboard (takes ~2 min).">⟳ Refresh from Qlik</button>
      <span id="qlik-status" style="font-size:11px;color:var(--mute)"></span>
    </div>
  </div>
  <div id="msg"></div>
  <div id="banner"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panel"></div>
</div>
<div id="tip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

const DAY=86400000;
const dn=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/DAY);
const fromDn=n=>{const t=new Date(n*DAY);return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};};
const dimOf=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const isoOf=n=>{const o=fromDn(n);return o.y+'-'+String(o.m).padStart(2,'0')+'-'+String(o.d).padStart(2,'0');};
const prettyDay=n=>{const o=fromDn(n);return o.d+' '+MONTHS[o.m-1]+' '+o.y;};
const validYMD=(y,m,d)=>y>=2000&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=dimOf(y,m);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isNum=v=>typeof v==='number'&&isFinite(v);
const todayISO=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const ratio=(a,b)=>(b>0&&isFinite(a/b))?a/b:null;

function parseDay(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){
    if(isNaN(v))return null;
    const t=new Date(v.getTime()+3600000);            // absorbs SheetJS sub-hour timezone drift
    return dn(t.getFullYear(),t.getMonth()+1,t.getDate());
  }
  if(typeof v==='number'){ return (v>20000&&v<80000)?dn(1899,12,30)+Math.floor(v):null; }
  const s=String(v).trim(); let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))){const y=+m[1],mo=+m[2],d=+m[3];return validYMD(y,mo,d)?dn(y,mo,d):null;}
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s))){
    let d=+m[1],mo=+m[2],y=+m[3]; if(y<100)y+=2000;
    if(mo>12&&d<=12){const t=d;d=mo;mo=t;}             // DD/MM/YYYY first, MM/DD only if unambiguous
    return validYMD(y,mo,d)?dn(y,mo,d):null;
  }
  if(/^\d{5}$/.test(s))return parseDay(+s);
  if(/[a-z]/i.test(s)){const t=new Date(s);if(!isNaN(t))return dn(t.getFullYear(),t.getMonth()+1,t.getDate());}
  return null;
}
function parseNum(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  if(v==null)return 0;
  let s=String(v).replace(/[€\s %]/g,'');
  if(s===''||s==='-')return 0;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');}
  else if(lc>=0){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):(/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,''));}
  const n=parseFloat(s);return isFinite(n)?n:0;
}
/* formatting – never emits NaN / Infinity */
const nf0=new Intl.NumberFormat('en-GB',{maximumFractionDigits:0});
function fmtEur(v,signed){
  if(!isNum(v))return '–';
  const a=Math.abs(v),sg=v<0?'−':(signed&&v>0?'+':'');
  if(a>=10000)return sg+'€'+(a/1000).toFixed(1)+'k';
  return sg+'€'+nf0.format(Math.round(a));
}
const fmtEurFull=v=>isNum(v)?(v<0?'−':'')+'€'+nf0.format(Math.round(Math.abs(v))):'–';
const fmtPct=(v,dp=1)=>isNum(v)?(v*100).toFixed(dp)+'%':'–';
const fmtPP=(d)=>isNum(d)?(d>=0?'+':'−')+Math.abs(d*100).toFixed(1)+'pp':'–';

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const nl=text.indexOf('\n'); const first=text.slice(0,nl<0?text.length:nl);
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0,n=text.length;i<n;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else if(ch==='"')inQ=true;
    else if(ch===delim){row.push(field);field='';}
    else if(ch==='\n'){row.push(field);field='';rows.push(row);row=[];}
    else if(ch!=='\r')field+=ch;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function toTable(rows){
  let hi=0;
  for(let i=0;i<Math.min(rows.length,15);i++){ if(rows[i].some(c=>/country/i.test(String(c)))){hi=i;break;} }
  return {headers:(rows[hi]||[]).map(h=>String(h==null?'':h).trim()),rows:rows.slice(hi+1)};
}
function pickCol(H,test,prefer){
  const c=[];H.forEach((h,i)=>{if(test(h))c.push(i);});
  if(!c.length)return -1;
  if(prefer){const p=c.find(i=>prefer(H[i]));if(p!=null)return p;}
  return c[0];
}
function newStats(t){return{rows:t.rows.length,kept:0,dropCountry:{},dropRole:0,badDate:0,missing:[],minDay:Infinity,maxDay:-Infinity,countries:new Set()};}

const durIdx=v=>{const n=parseInt(v,10);return n===1?0:n===3?1:n===6?2:n===12?3:4;};

  const ix={

function processAdspend(t){

/* =====================================================================
   MODEL: daily series per segment (country × role), aligned on a day axis
   ===================================================================== */
const segIdx=(c,role)=>VIDX[c]*2+role-1;
function buildModel(prem,adv){
  if(!prem||!prem.st||prem.st.maxDay<0||!isFinite(prem.st.maxDay))return null;
  const dataDate=prem.st.maxDay;
  let dayMin=prem.st.minDay;
  if(adv&&adv.st&&isFinite(adv.st.minDay)&&adv.st.minDay<dayMin)dayMin=adv.st.minDay;
  const D=dataDate-dayMin+1;
  const ser=[];for(let i=0;i<VALID.length*2;i++)ser.push({fp:new Float64Array(D),rev:new Float64Array(D),nu:new Float64Array(D),ad:new Float64Array(D),ltv:new Float64Array(D),kn:null,hasLtv:false});
  for(const[k,v]of prem.agg){const day=k%65536,seg=(k-day)/65536,s=ser[seg];s.fp[day-dayMin]+=v[0];s.rev[day-dayMin]+=v[1];s.nu[day-dayMin]+=v[2];}
  let adAfter=0;
  if(adv)for(const[k,v]of adv.agg){const day=k%65536,seg=(k-day)/65536;if(day>dataDate){adAfter++;continue;}ser[seg].ad[day-dayMin]+=v;}
  // trailing-28-day Parents share of adspend per country: used to split country-level budgets
  Object.keys(ROLE_SPLIT).forEach(k=>delete ROLE_SPLIT[k]);
  const eL=D-1;
  VALID.forEach((c,ci)=>{
    let a=sumRange(ser[ci*2].ad,eL-27,eL),b=sumRange(ser[ci*2+1].ad,eL-27,eL);
    if(a+b<=0){a=sumRange(ser[ci*2].ad,0,eL);b=sumRange(ser[ci*2+1].ad,0,eL);}
    ROLE_SPLIT[c]=a+b>0?a/(a+b):null;
  });
  // daily LTV acquired = new premium users × LTV/user (mix-weighted by psp × duration when the extract has those columns)
  const mixUsed=!!(prem.mix&&prem.mix.size);
  if(mixUsed)for(const[k,u]of prem.mix){
    const day=k%65536,sc=(k-day)/65536,combo=sc%15,seg=(sc-combo)/15,c=VALID[seg>>1],role=(seg&1)+1,sl=LTV.seg[c+'|'+role];
    if(!sl)continue;
    const sr=ser[seg];if(!sr.kn)sr.kn=new Float64Array(D);
    const e=LTV.combo[c+'|'+role+'|'+combo];
    sr.ltv[day-dayMin]+=u*(e&&e[0]>=CFG.params.ltvMinN?e[1]:sl[3]);sr.kn[day-dayMin]+=u;
  }
  ser.forEach((sr,seg)=>{
    const sl=LTV.seg[VALID[seg>>1]+'|'+((seg&1)+1)];sr.hasLtv=!!sl;
    if(sl)for(let i=0;i<D;i++){sr.ltv[i]+=Math.max(0,sr.nu[i]-(sr.kn?sr.kn[i]:0))*sl[3];}
  });
  const active=ser.map(s=>{let a=0;for(let i=0;i<D;i++){if(s.fp[i]||s.ad[i]){a=1;break;}}return a;});
  return{dayMin,dataDate,D,ser,active,mixUsed,adAfter,adLast:adv&&isFinite(adv.st.maxDay)?adv.st.maxDay:null};
}
function makeCtx(M,s){
  const dd=fromDn(M.dataDate),dom=dd.d-s,dim=dimOf(dd.y,dd.m);
  const e=M.dataDate-s-M.dayMin;
  const pmm=dd.m===1?12:dd.m-1,pmy=dd.m===1?dd.y-1:dd.y,pmS=dn(pmy,pmm,1)-M.dayMin,pmE=dn(dd.y,dd.m,1)-1-M.dayMin;
  return{pmS,pmE,hasPM:pmS>=0,y:dd.y,m:dd.m,dom,dim,daysLeft:dim-dom,pct:dom/dim,e,ms:dn(dd.y,dd.m,1)-M.dayMin,
    hist7:e-6>=0,hist14:e-13>=0,shift:s,dayNum:M.dataDate-s,monthStartBeforeData:dn(dd.y,dd.m,1)<M.dayMin};
}
const planOf=(c,m,role)=>{
  const p=PLANNED_SPEND[c]&&PLANNED_SPEND[c][m];
  if(p)return isFinite(p[role-1])?+p[role-1]:0;
  const t=PLANNED_TOTAL[c]&&PLANNED_TOTAL[c][m];
  if(t>0){const sp=ROLE_SPLIT[c]!=null?ROLE_SPLIT[c]:0.5;return t*(role===1?sp:1-sp);}
  return 0;
};
const hasBudget=()=>Object.keys(PLANNED_SPEND).length>0||Object.keys(PLANNED_TOTAL).some(c=>Object.keys(PLANNED_TOTAL[c]).length>0);
const hasExplicit=(c,m)=>!!(PLANNED_SPEND[c]&&PLANNED_SPEND[c][m]);
function applySeed(){
  Object.keys(SEED_PLAN_ROLE).forEach(c=>{PLANNED_SPEND[c]={};[0,1,2].forEach(i=>{PLANNED_SPEND[c][10+i]=[SEED_PLAN_ROLE[c][0][i],SEED_PLAN_ROLE[c][1][i]];});});
  Object.keys(SEED_PLAN_NEW).forEach(c=>{PLANNED_SPEND[c]={};[0,1,2].forEach(i=>{const t=SEED_PLAN_NEW[c][i],pp=SEED_NEW_MIX[i][0]/(SEED_NEW_MIX[i][0]+SEED_NEW_MIX[i][1]);PLANNED_SPEND[c][10+i]=[t*pp,t*(1-pp)];});});
  Object.keys(SEED_FPROAS).forEach(c=>{CFG.countryTargets[c]={10:SEED_FPROAS[c][0],11:SEED_FPROAS[c][1],12:SEED_FPROAS[c][2]};});
  [10,11,12].forEach((m,i)=>{CFG.targets[m]=SEED_GLOBAL_FPROAS[i];});
  Object.keys(SEED_ROLE_FPROAS).forEach(c=>{CFG.roleTargets[c]={};[1,2].forEach(r=>{CFG.roleTargets[c][r]={10:SEED_ROLE_FPROAS[c][r-1][0],11:SEED_ROLE_FPROAS[c][r-1][1],12:SEED_ROLE_FPROAS[c][r-1][2]};});});
  CFG.plannedUpdated=SEED_STAMP;CFG.targetsUpdated=SEED_STAMP;
}
function snapshotPlan(){return JSON.stringify({ps:PLANNED_SPEND,pt:PLANNED_TOTAL,rt:CFG.roleTargets,ct:CFG.countryTargets,t:CFG.targets,pu:CFG.plannedUpdated,tu:CFG.targetsUpdated});}
function restorePlan(j){
  const o=JSON.parse(j);
  [PLANNED_SPEND,PLANNED_TOTAL,CFG.roleTargets,CFG.countryTargets,CFG.targets].forEach(x=>Object.keys(x).forEach(k=>delete x[k]));
  Object.assign(CFG.roleTargets,o.rt);Object.assign(PLANNED_SPEND,o.ps);Object.assign(PLANNED_TOTAL,o.pt);Object.assign(CFG.countryTargets,o.ct);Object.assign(CFG.targets,o.t);
  CFG.plannedUpdated=o.pu;CFG.targetsUpdated=o.tu;

const targetFor=(c,m,role)=>{
  const r=CFG.roleTargets[c]&&CFG.roleTargets[c][role]&&CFG.roleTargets[c][role][m];
  if(isNum(r))return r;
  const o=CFG.countryTargets[c];return(o&&isNum(o[m]))?o[m]:CFG.targets[m];
};
function percentile(arr,p){
  const a=arr.slice().sort((x,y)=>x-y);if(!a.length)return null;
  const pos=p*(a.length-1),lo=Math.floor(pos),hi=Math.ceil(pos);

function sumRange(arr,a,b){let s=0;for(let i=Math.max(a,0);i<=b;i++)s+=arr[i];return s;}

/* =====================================================================
   CORE CALCULATIONS  (spec §5)
   ===================================================================== */
const ADD=['nu7','nuPM','adPM','ltvMtd','ltv7','ltvPM','nuLMtd','adLMtd','adL7','adLPM','fpMtd','adMtd','revMtd','nuMtd','plan','planPro','fp7','ad7','fp14','ad14','adPrev7','fpProj','adProj','needed','adRem','runFP','ceilFP','nLeaf','nActive','nFallback'];

function leafCompute(M,c,role,cx){
  const P=CFG.params,s=M.ser[segIdx(c,role)],e=cx.e,ms=cx.ms;
  const o={country:c,role,tgt0:targetFor(c,cx.m,role)};
  o.fpMtd=sumRange(s.fp,ms,e);o.adMtd=sumRange(s.ad,ms,e);o.revMtd=sumRange(s.rev,ms,e);o.nuMtd=sumRange(s.nu,ms,e);
  o.fp7=sumRange(s.fp,e-6,e);o.ad7=sumRange(s.ad,e-6,e);
  o.fp14=sumRange(s.fp,e-13,e);o.ad14=sumRange(s.ad,e-13,e);
  o.adPrev7=sumRange(s.ad,e-13,e-7);
  o.nu7=sumRange(s.nu,e-6,e);o.ltvMtd=sumRange(s.ltv,ms,e);o.ltv7=sumRange(s.ltv,e-6,e);
  const hl=s.hasLtv;o.nuLMtd=hl?o.nuMtd:0;o.adLMtd=hl?o.adMtd:0;o.adL7=hl?o.ad7:0;
  if(cx.hasPM){o.adPM=sumRange(s.ad,cx.pmS,cx.pmE);o.nuPM=sumRange(s.nu,cx.pmS,cx.pmE);o.ltvPM=sumRange(s.ltv,cx.pmS,cx.pmE);o.adLPM=hl?o.adPM:0;}
  else{o.adPM=0;o.nuPM=0;o.ltvPM=0;o.adLPM=0;}
  o.plan=planOf(c,cx.m,role);o.planPro=o.plan*cx.pct;
  // run-rate for the remaining spend
  const win7ok=cx.dom>=P.minDays&&cx.hist7&&o.ad7>=P.adFloor,win14ok=cx.dom>=P.minDays&&cx.hist14&&o.ad14>=P.adFloor;
  let run=null,src='MTD';
  if(P.runWindow==='7d'&&win7ok){run=o.fp7/o.ad7;src='7d';}
  else if(P.runWindow==='14d'&&win14ok){run=o.fp14/o.ad14;src='14d';}
  else if(o.adMtd>0){run=o.fpMtd/o.adMtd;src='MTD';}
  o.runLeaf=run;o.runSrc=src;
  // achievable ceiling: P90 of weekly FPROAS over trailing weeks
  const nW=P.ceilWeeks,wkFP=new Array(nW).fill(0),wkAD=new Array(nW).fill(0),rates=[];
  for(let w=0;w<nW;w++){
    const end=e-7*w,start=end-6;if(start<0)continue;
    const f=sumRange(s.fp,start,end),a=sumRange(s.ad,start,end);
    wkFP[nW-1-w]=f;wkAD[nW-1-w]=a;
    if(a>=P.adFloor)rates.push(f/a);
  }
  o.wkFP=wkFP;o.wkAD=wkAD;o.validWeeks=rates.length;
  let ceil=null,fallback=false;
  if(run!=null){
    if(rates.length>=P.ceilMinWeeks)ceil=Math.max(percentile(rates,P.ceilPct),run);
    else{ceil=run*P.ceilStretch;fallback=true;}
  }

  const noPlan=o.plan<=0;
  o.insufficient=!(o.adMtd>0)||run==null;
  o.adRem=(cx.daysLeft>0&&!noPlan&&!o.insufficient)?Math.max(0,o.plan-o.adMtd):0;
  o.runFP=o.adRem*(run||0);o.ceilFP=o.adRem*(ceil||0);
  o.fpProj=o.fpMtd+o.runFP;o.adProj=o.adMtd+o.adRem;o.needed=o.tgt0*o.adProj;
  o.nLeaf=1;o.nActive=o.adRem>0?1:0;o.nFallback=(o.adRem>0&&fallback)?1:0;

}

function sumNodes(list,cx){
  const o={};
  ADD.forEach(k=>{o[k]=0;});
  const nW=CFG.params.ceilWeeks;o.wkFP=new Array(nW).fill(0);o.wkAD=new Array(nW).fill(0);
  for(const n of list){
    ADD.forEach(k=>{o[k]+=n[k]||0;});
    for(let i=0;i<nW;i++){o.wkFP[i]+=n.wkFP[i];o.wkAD[i]+=n.wkAD[i];}
  }
  o.tgt0=o.adProj>0?o.needed/o.adProj:CFG.targets[cx.m];
  o.country=list.length===1?list[0].country:null;
  return derive(o,cx);
}

function derive(o,cx){
  const P=CFG.params;
  o.fproasMtd=ratio(o.fpMtd,o.adMtd);
  o.win7ok=cx.dom>=P.minDays&&cx.hist7&&o.ad7>=P.adFloor;
  o.win14ok=cx.dom>=P.minDays&&cx.hist14&&o.ad14>=P.adFloor;
  o.fproas7=o.win7ok?o.fp7/o.ad7:null;
  o.fproas14=o.win14ok?o.fp14/o.ad14:null;
  o.target=o.adProj>0?o.needed/o.adProj:o.tgt0;
  o.projEom=o.adProj>0?o.fpProj/o.adProj:null;
  o.run=o.adRem>0?o.runFP/o.adRem:null;
  o.ceil=o.adRem>0?o.ceilFP/o.adRem:null;
  o.required=o.adRem>0?(o.needed-o.fpMtd)/o.adRem:null;
  o.surplus=o.fpProj-o.needed;
  o.lowConf=cx.dom<P.minDays||(o.adMtd>0&&o.adMtd<P.adFloor);
  o.limited=o.nActive>0&&o.nFallback>=o.nActive;
  o.cx=cx;
  o.status=statusOf(o,cx);
  // pacing (spec §5.6)
  const pc=P.pace;
  o.pacing=o.planPro>0?o.adMtd/o.planPro:null;
  o.gap=o.plan>0?o.adMtd-o.planPro:null;
  o.dailyBasis=(cx.dom>=CFG.params.minDays&&cx.hist7)?'last 7 days':'MTD average';
  o.daily7=o.dailyBasis==='last 7 days'?o.ad7/7:(cx.dom>0?o.adMtd/cx.dom:0);
  o.adProjRun=o.adMtd+o.daily7*cx.daysLeft;
  o.projPacing=o.plan>0?o.adProjRun/o.plan:null;
  o.dailyNeeded=(cx.daysLeft>0&&o.plan>0)?Math.max(0,(o.plan-o.adMtd)/cx.daysLeft):null;
  o.growth7=(cx.dom>=P.minDays&&cx.hist14&&o.adPrev7>0)?(o.ad7-o.adPrev7)/o.adPrev7:null;
  if(o.pacing==null){o.pcls='none';o.pcol='n';}
  else{
    o.pcls=o.pacing<pc.gLo?'under':(o.pacing>pc.gHi?'over':'on');
    o.pcol=(o.pacing>=pc.gLo&&o.pacing<=pc.gHi)?'g':((o.pacing>=pc.aLo&&o.pacing<pc.gLo)||(o.pacing>pc.gHi&&o.pacing<=pc.aHi)?'a1':'r');
  }
  o.decision=decide(o);
  // LTV / CAC (blended: all new premium users vs paid adspend)
  o.cac=ratio(o.adMtd,o.nuMtd);o.cac7=o.win7ok?ratio(o.ad7,o.nu7):null;o.cacPM=cx.hasPM?ratio(o.adPM,o.nuPM):null;
  o.ltvUser=ratio(o.ltvMtd,o.nuLMtd);o.ltvCac=ratio(o.ltvMtd,o.adLMtd);
  o.ltvCac7=o.win7ok?ratio(o.ltv7,o.adL7):null;o.ltvCacPM=cx.hasPM?ratio(o.ltvPM,o.adLPM):null;
  o.cacHeadroom=(o.ltvUser!=null&&o.cac!=null)?o.ltvUser/P.ltvGreen-o.cac:null;
  o.ltvStatus=ltvStatusOf(o);
  return o;
}
function ltvStatusOf(o){
  const P=CFG.params,r=o.ltvCac;
  if(r==null)return{cls:'n',label:'No LTV',tip:'No LTV entry for this market × user type, or no new premium users / adspend yet.'};
  const cls=r>=P.ltvGreen?'g':(r>=P.ltvAmber?'a1':'r');
  return{cls,label:r.toFixed(2)+'×',low:o.nuMtd<P.ltvMinUsers,tip:'LTV/CAC '+r.toFixed(2)+'×: 12M LTV acquired '+fmtEurFull(o.ltvMtd)+' ÷ adspend '+fmtEurFull(o.adLMtd)+'. Green ≥ '+P.ltvGreen+'×, amber ≥ '+P.ltvAmber+'×, red below.'};
}

function statusOf(o,cx){
  const E=1e-9,T=o.target,P=CFG.params,pc=v=>fmtPct(v,1),runLbl=o.runSrc?o.runSrc+' ':'';
  if(o.plan<=0&&!(o.adRem>0))return{key:'nobudget',cls:'n',label:'No budget',tip:'No planned budget for this country × user type this month, so FPROAS-to-target is not projected. Add it to the budget config (PLANNED_TOTAL / PLANNED_SPEND) in the file.'};
  if(!(o.adMtd>0)&&!(o.adRem>0))return{key:'nodata',cls:'n',label:'No data',tip:'No adspend recorded this month for this segment: nothing to project.'};
  if(!(o.adRem>0)){
    const hit=o.fproasMtd!=null&&o.fproasMtd>=T-E;
    return{key:hit?'hit':'missed',cls:hit?'g':'r',label:hit?'Hit':'Missed',
      tip:(cx.daysLeft>0?'Month locked (planned budget fully deployed)':'Month ended')+': FPROAS '+pc(o.fproasMtd)+' vs target '+pc(T)+' → '+(hit?'Hit':'Missed')+'.'};
  }
  const need=fmtEurFull(o.adRem);
  if(o.required<=E)return{key:'secured',cls:'g',label:'Secured',tip:'First payments already booked cover the target for the full planned spend (required FPROAS on the remaining '+need+' is ≤ 0).'};
  if(o.projEom>=T-E)return{key:'ontrack',cls:'g',label:'On track',tip:'Projected EOM FPROAS '+pc(o.projEom)+' ≥ target '+pc(T)+'. Needs only '+pc(o.required)+' on the remaining '+need+' vs run-rate '+pc(o.run)+'.'};
  const body='Needs '+pc(o.required)+' on the remaining '+need+' vs run-rate '+pc(o.run)+(o.runSrc?' ('+o.runSrc+')':'')+' and best-case '+pc(o.ceil)+(o.limited?' (fallback ceiling: limited history)':'')+' → ';
  if(o.ceil!=null&&o.required<=o.ceil+E){
    const light=o.required<=o.run*P.lightAmber+E;
    return{key:light?'recover':'stretch',cls:light?'a1':'a2',label:light?'Recoverable':'Recoverable – stretch',tip:body+(light?'Recoverable (within 10% of run-rate).':'Recoverable only if performance returns near best-case (stretch).')};
  }
  return{key:'off',cls:'r',label:'Off track',tip:body+'Off track: even best-case performance on the remaining budget cannot reach target.'};
}

function decide(o){
  const s=o.status.cls,p=o.pcls;
  if(o.status.key==='nobudget'||p==='none')return{key:'nobudget',cls:'n',label:'No budget',detail:''};
  if(s==='n')return{key:'nosignal',cls:'n',label:'No signal',detail:''};
  const add=o.dailyNeeded!=null?Math.max(0,o.dailyNeeded-o.daily7):null;
  const over=o.gap!=null?o.gap:null;
  if(s==='g'){
    if(p==='under')return{key:'inc',cls:'inc',label:'Increase',detail:add!=null&&add>0?'+'+fmtEur(add)+'/day to reach plan':'Room in plan'};
    return{key:'hold',cls:'hold',label:'Hold / maintain',detail:''};
  }
  if(s==='a1'||s==='a2'){
    if(p==='under')return{key:'cau',cls:'cau',label:'Increase cautiously',detail:add!=null&&add>0?'up to +'+fmtEur(add)+'/day; apply elasticity haircut':'Use simulator for haircut'};
    return{key:'hold',cls:'hold',label:'Hold',detail:'Watch 7d trend'};
  }
  if(p==='under')return{key:'holdlow',cls:'hold',label:'Hold below plan',detail:'Do not chase budget'};
  return{key:'red',cls:'red',label:'Reduce / reallocate',detail:(over!=null&&over>0?fmtEur(over)+' above pro-rata · ':'')+'shift to Green markets'};
}

/* ----- aggregation over the whole model ----- */
const S={tab:'country',market:'all',country:null,sort:{},trackerView:'country',ltvView:'country',showAll:false,budgetMonth:null,model:null,R:null,files:{},demo:false,demoBudget:false,premAgg:null,adAgg:null};
const inMarket=c=>S.market==='all'||(S.market==='new'?NEW_MARKETS.includes(c):!NEW_MARKETS.includes(c));

function computeAll(){
  const M=S.model;if(!M){S.R=null;return;}
  const cx0=makeCtx(M,0),cx7=cx0.dom>=8?makeCtx(M,7):null,countries=[];
  for(const c of VALID){
    const active=[1,2].some(r=>M.active[segIdx(c,r)])||[1,2].some(r=>planOf(c,cx0.m,r)>0);
    if(!active)continue;
    const kids=[1,2].map(r=>({key:c+'|'+r,country:c,role:r,cur:leafCompute(M,c,r,cx0),prev:cx7?leafCompute(M,c,r,cx7):null}));
    countries.push({country:c,key:c,kids,cur:sumNodes(kids.map(k=>k.cur),cx0),prev:cx7?sumNodes(kids.map(k=>k.prev),cx7):null});
  }
  S.R={cx0,cx7,countries};
}
/* Scope: a market is in the roll-ups only if it has a plan or adspend this month. Markets with first payments but
   no spend/plan (e.g. CO, MX) are organic-only; counting their FP would inflate FPROAS (this reconciles to the 2025 tables). */
const inScope=c=>c.cur.plan>0||c.cur.adMtd>0;
const scopeCountries=()=>S.R?S.R.countries.filter(c=>inMarket(c.country)&&inScope(c)):[];
const outOfScope=()=>S.R?S.R.countries.filter(c=>!inScope(c)):[];
const visibleCountries=()=>S.R?S.R.countries.filter(c=>inMarket(c.country)&&(S.showAll||inScope(c))):[];
const visibleLeaves=()=>visibleCountries().flatMap(c=>c.kids);
const inScopeCode=code=>{const c=S.R&&S.R.countries.find(x=>x.country===code);return !!c&&inScope(c);};
const scopeLeaves=()=>scopeCountries().flatMap(c=>c.kids);
function globalNode(){
  const R=S.R,vc=scopeCountries();
  const cur=sumNodes(vc.flatMap(c=>c.kids.map(k=>k.cur)),R.cx0);cur.country=null;
  const prev=R.cx7?sumNodes(vc.flatMap(c=>c.kids.map(k=>k.prev)),R.cx7):null;
  return{cur,prev};
}

function dataNotes(){
  const out=[],M=S.model,af=S.files.adspend;
  if(!M)return out;
  if(!af||af.st.missing.length)out.push('Adspend file not loaded: spend, pacing and FPROAS are not meaningful.');
  else if(M.adLast!=null&&M.adLast<M.dataDate)out.push('Adspend data ends '+prettyDay(M.adLast)+', before the premium data date ('+prettyDay(M.dataDate)+'): MTD FPROAS is overstated. Re-export adspend.');
  if(S.R.cx0.monthStartBeforeData)out.push('Data starts after the 1st of the month: MTD figures are partial.');
  const sp=[];for(const c of S.R.countries)if(inScope(c))for(const k of c.kids)if(k.cur.adMtd>0&&k.cur.fpMtd<=0)sp.push(c.country+' '+ROLE[k.role]);
  if(sp.length)out.push('Spend but zero first payments this month: '+sp.join(', ')+'.');
  return out;
}

function wowArrow(cur,prev,what){

function tableHTML(id,cols,rows,total,opts){
  opts=opts||{};
  const st=S.sort[id]||opts.defSort||null;
  const list=rows.slice();
  if(st){
    const col=cols.find(c=>c.id===st.k);
    if(col){
      const dir=st.dir==='asc'?1:-1;
      list.sort((a,b)=>{
        const x=col.v(a),y=col.v(b),nx=x==null||(typeof x==='number'&&!isFinite(x)),ny=y==null||(typeof y==='number'&&!isFinite(y));
        if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;
        return(typeof x==='string'?x.localeCompare(y):x-y)*dir;
      });
    }
  }
  const head=cols.map(c=>{
    const sorted=st&&st.k===c.id;
    return '<th class="'+(c.left?'l':'')+(sorted?' sorted':'')+(c.nosort?' nosort':'')+(c.sep?' vsep':'')+'" '+(c.w?'style="min-width:'+c.w+'px" ':'')+(c.nosort?'':'data-sort="'+id+':'+c.id+'" ')+'data-tip="'+esc(c.tip||'')+'">'+esc(c.h)+(sorted?(st.dir==='asc'?' ▲':' ▼'):'')+'</th>';
  }).join('');
  const rowHTML=(r,cls)=>'<tr class="'+(cls||'')+(r.country&&r.country===S.country&&opts.clickable?' sel':'')+(opts.clickable&&!cls?' click':'')+'" '+(opts.clickable&&r.country&&!cls?'data-country="'+r.country+'"':'')+'>'+cols.map(c=>'<td class="'+(c.left?'l':'')+(c.sep?' vsep':'')+'">'+c.f(r)+'</td>').join('')+'</tr>';
  return '<div class="tw"><table><thead><tr>'+head+'</tr></thead><tbody>'+(total?rowHTML(total,'total'):'')+list.map(r=>rowHTML(r)).join('')+'</tbody></table></div>';
}

function spark(wkFP,wkAD,target){
  const vals=wkFP.map((f,i)=>wkAD[i]>=CFG.params.adFloor?f/wkAD[i]:null);
  const nums=vals.filter(v=>v!=null);
  if(nums.length<2)return '<span class="mute">–</span>';
  const W=120,H=28,pd=3,all=nums.concat(isNum(target)?[target]:[]);
  const lo=Math.min(...all),hi=Math.max(...all),span=(hi-lo)||1;
  const X=i=>pd+i*(W-2*pd)/(vals.length-1),Y=v=>H-pd-((v-lo)/span)*(H-2*pd);
  let pts='',last=null;
  vals.forEach((v,i)=>{if(v!=null){pts+=(pts?' ':'')+X(i).toFixed(1)+','+Y(v).toFixed(1);last=[X(i),Y(v)];}});
  const tl=isNum(target)?'<line x1="'+pd+'" x2="'+(W-pd)+'" y1="'+Y(target).toFixed(1)+'" y2="'+Y(target).toFixed(1)+'" stroke="currentColor" stroke-opacity=".45" stroke-dasharray="3 3"/>':'';
  const tip='Weekly FPROAS, oldest → latest 7-day block ('+nums.map(v=>fmtPct(v,0)).join(', ')+'). Dashed = target.';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" data-tip="'+esc(tip)+'" style="color:var(--mute)">'+tl+'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.5" fill="var(--accent)"/></svg>';
}

function setMsg(text,cls){$('msg').innerHTML=text?'<div class="note '+(cls||'')+'">'+esc(text)+'</div>':'';}
function rebuild(){
  const p=S.files.premium&&!S.files.premium.st.missing.length?{agg:S.premAgg,st:S.files.premium.st,mix:S.premMix}:null;
  const a=S.files.adspend&&!S.files.adspend.st.missing.length?{agg:S.adAgg,st:S.files.adspend.st}:null;
  S.model=buildModel(p,a);
  recompute();
  if(S.model&&!S.budgetMonth)S.budgetMonth=S.R.cx0.m;
  if(S.model)S.budgetMonth=S.R.cx0.m;
  renderAll();

function ingest(kind,table,name){
  const res=kind==='premium'?processPremium(table):processAdspend(table);
  S.files[kind]={name,st:res.st};
  if(kind==='premium'){S.premAgg=res.agg;S.premMix=res.mix;}else S.adAgg=res.agg;
  $(kind==='premium'?'fn-prem':'fn-ad').textContent=name+(res.st.missing.length?' (error)':'');
  if(res.st.missing.length)setMsg(name+': missing required column(s): '+res.st.missing.join(', '),'err');
  else setMsg('');
}
function parseLTVWorkbook(wb){
  const find=pred=>{const n=wb.SheetNames.find(x=>pred(x.toLowerCase().trim()));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(1):null;};
  const a=find(n=>n==='country x webrole'),b=find(n=>n.startsWith('country x webrole x psp x dur'));
  if(!a)return null;
  const out={asOf:'uploaded '+todayISO(),seg:{},combo:{}};
  const role=v=>/^parent/i.test(v)?1:(/^sitter/i.test(v)?2:0);
  const code=v=>NAME2CODE[v]||String(v).trim().toUpperCase();
  a.forEach(r=>{const c=code(r[0]),rl=role(r[1]);if((c in VIDX)&&rl&&isFinite(+r[5])&&r[5]!=='')out.seg[c+'|'+rl]=[+r[2],+r[3],+r[4],+r[5]];});
  if(b)b.forEach(r=>{const c=code(r[0]),rl=role(r[1]);if((c in VIDX)&&rl&&isFinite(+r[7])&&r[7]!=='')out.combo[c+'|'+rl+'|'+(pspIdx(r[2])*5+durIdx(r[3]))]=[+r[4],+r[7]];});
  return Object.keys(out.seg).length?out:null;
}
async function handleLTV(file){
  if(!file)return;
  try{
    if(typeof XLSX==='undefined'){setMsg('The XLSX parser (SheetJS) could not be loaded.','err');return;}
    const out=parseLTVWorkbook(XLSX.read(await file.arrayBuffer(),{type:'array'}));
    if(!out){setMsg(file.name+': no "Country x Webrole" sheet with LTV/user found.','err');return;}
    LTV.asOf=out.asOf+' ('+file.name+')';LTV.seg=out.seg;LTV.combo=out.combo;
    $('fn-ltv').textContent=file.name;setMsg('');
    if(S.premAgg)rebuild();else renderAll();
  }catch(err){setMsg('Could not read '+file.name+': '+err.message,'err');}
}
function dropDemoState(){
  if(!S.demo)return;
  S.demo=false;
  if(S.demoBudget){restorePlan(S.planBackup);S.demoBudget=false;}
  S.files={};S.premAgg=null;S.adAgg=null;
}
async function handleFile(kind,file){
  if(!file)return;
  dropDemoState();
  try{
    let rows;
    if(/\.(csv|txt|tsv)$/i.test(file.name)){
      rows=parseCSV(new TextDecoder('utf-8').decode(await file.arrayBuffer()));
    }else{
      if(typeof XLSX==='undefined'){setMsg('The XLSX parser (SheetJS) could not be loaded – check your connection or export the file as CSV.','err');return;}
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      let best=null;
      for(const sn of wb.SheetNames){
        const r=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,cellDates:true,defval:''});
        if(r.slice(0,15).some(row=>row.some(c=>/country/i.test(String(c))))){best=r;break;}
        if(!best)best=r;
      }
      rows=best||[];
    }
    ingest(kind,toTable(rows),file.name);
    rebuild();
  }catch(err){setMsg('Could not read '+file.name+': '+err.message,'err');}
}

/* ----- synthetic demo ----- */
function genDemo(){
  let seed=20261006;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const now=new Date();let y=now.getFullYear(),m=now.getMonth()+1;
  if(now.getDate()<=18){m--;if(m<1){m=12;y--;}}
  const dataDate=dn(y,m,18),start=dataDate-95;
  const scale={DE:4200,FR:3000,GB:3400,NL:1700,ES:1500,IT:1400,BE:900,CA:1900,BR:1200,MX:1000,CO:600,AR:500,DK:700,FI:500,NO:650,IE:450,PL:520,PT:420,RO:380,MY:300};
  const newStart=dataDate-34;                      // new markets: only ~5 weeks of history
  const premH=['country_lt','webrole id','psp','duration_months','calendar date','(€) First Payments','(€) Returning','(€) Recurring','Total No. NEW Premium Users'];
  const adH=['country_lt','webrole id','Channel','Adspend','calendar date'];
  const prem=[],adr=[];
  VALID.forEach((c,ci)=>{
    [1,2].forEach(role=>{
      const base=scale[c]*(role===1?1:0.42),roas0=0.47+rnd()*0.24,slope=(rnd()-0.5)*0.004,ph=rnd()*6;
      for(let d=start;d<=dataDate;d++){
        if(NEW_MARKETS.includes(c)&&d<newStart)continue;
        const dow=(d+4)%7;
        const ad=base*(1+0.18*Math.sin(d/3.3+ph)+(rnd()-0.5)*0.2)*(dow>=5?0.85:1)*(1+(d-start)*0.0015);
        const roas=Math.max(0.15,roas0*(1+(rnd()-0.5)*0.22)+slope*(d-start)*0.2);
        const fp=ad*roas,o=fromDn(d);
        const dstr=(ci%2?o.y+'-'+String(o.m).padStart(2,'0')+'-'+String(o.d).padStart(2,'0'):String(o.d).padStart(2,'0')+'/'+String(o.m).padStart(2,'0')+'/'+o.y);
        adr.push([c,role,'Paid',ad.toFixed(2),dstr]);
        [['Adyen',0.6],['PayPal',0.4]].forEach(([psp,w])=>[['1',0.5],['12',0.5]].forEach(([dur,w2])=>{
          const f=fp*w*w2;prem.push([c,role,psp,dur,o.y+'-'+String(o.m).padStart(2,'0')+'-'+String(o.d).padStart(2,'0'),f.toFixed(2),(f*0.3).toFixed(2),(f*1.4).toFixed(2),Math.round(f/38)]);
        }));
      }
    });
  });
  prem.push(['DN',1,'Adyen','1','2026-01-01','100','0','0','1'],['0','-','Adyen','1','2026-01-01','50','0','0','1'],['DE','-','Adyen','1',isoOf(dataDate),'20','0','0','0']);
  adr.push(['DN',1,'Paid','999','2026-01-01'],['0','-','Paid','5','2026-01-01']);
  Object.keys(PLANNED_SPEND).forEach(k=>delete PLANNED_SPEND[k]);
  const dim=dimOf(y,m);
  VALID.forEach(c=>{PLANNED_SPEND[c]=PLANNED_SPEND[c]||{};PLANNED_SPEND[c][m]=[Math.round(scale[c]*dim*(0.85+rnd()*0.3)/100)*100,Math.round(scale[c]*0.42*dim*(0.85+rnd()*0.3)/100)*100];});
  return{prem:{headers:premH,rows:prem},ad:{headers:adH,rows:adr}};
}
function loadDemo(){
  if(!S.demoBudget)S.planBackup=snapshotPlan();
  S.demo=false;[PLANNED_SPEND,PLANNED_TOTAL,CFG.roleTargets,CFG.countryTargets].forEach(x=>Object.keys(x).forEach(k=>delete x[k]));Object.assign(CFG.targets,DEFAULT_TARGETS);
  const d=genDemo();
  ingest('premium',d.prem,'demo-premium.csv (synthetic)');
  ingest('adspend',d.ad,'demo-adspend.csv (synthetic)');
  S.demo=true;S.demoBudget=true;CFG.plannedUpdated=todayISO();
  rebuild();
}

/* =====================================================================
   QLIK AUTO-LOAD
   ===================================================================== */
async function loadQlikJSON(url){
  const resp = await fetch(url, {cache:'reload'});
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function applyQlikData(data){
  dropDemoState();
  ingest('premium', data.premiumData, 'Qlik – auto ('+data.generated.slice(0,10)+')');
  ingest('adspend', data.adspendData, 'Qlik – auto ('+data.generated.slice(0,10)+')');
  const status = $('qlik-status');
  if(status) status.textContent = 'Last refreshed: '+(data.generated||'?').slice(0,19).replace('T',' ')+'Z';
  rebuild();
}

async function autoLoadQlik(){
  if(!QLIK_DATA_URL) return;
  try {
    const data = await loadQlikJSON(QLIK_DATA_URL);
    applyQlikData(data);
  } catch(e){
    // silently skip if JSON file not found (file-based local use without a server)
    if(!e.message.includes('Failed to fetch') && !e.message.includes('HTTP 404') && !e.message.includes('NetworkError')){
      console.warn('Qlik auto-load:', e.message);
    }
  }
}

async function refreshFromQlik(){
  const btn = $('btn-refresh');
  const status = $('qlik-status');
  if(!QLIK_REFRESH_API) return;
  try {
    if(btn){ btn.disabled=true; btn.textContent='⟳ Refreshing…'; }
    if(status) status.textContent='Calling Qlik… (~2 min)';
    const resp = await fetch(QLIK_REFRESH_API, {method:'POST'});
    if(!resp.ok) throw new Error(`Refresh API returned HTTP ${resp.status}`);
    if(status) status.textContent='Qlik pull complete — reloading data…';
    // Wait a beat then reload the JSON
    await new Promise(r=>setTimeout(r,2000));
    const data = await loadQlikJSON(QLIK_DATA_URL);
    applyQlikData(data);
  } catch(e){
    setMsg('Qlik refresh failed: '+e.message,'err');
    if(status) status.textContent='Refresh failed.';
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='⟳ Refresh from Qlik'; }
  }
}

    try{ await autoLoadQlik(); } catch(e){ setMsg('Load failed: '+e.message,'err'); }
    finally{ btn.disabled=false; btn.textContent='↻ Load Qlik data'; }
  });
  if(QLIK_REFRESH_API){ const rb=$('btn-refresh'); if(rb)rb.style.display=''; }
  $('btn-refresh').addEventListener('click',refreshFromQlik);
  const tip=$('tip');
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&t.dataset.tip){tip.textContent=t.dataset.tip;tip.style.display='block';}else tip.style.display='none';});
  document.addEventListener('mousemove',e=>{
    if(tip.style.display!=='block')return;
    const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+16;
    if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-12;
    tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px';
  });
  document.addEventListener('click',e=>{
    const t=e.target;
    const tab=t.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;renderTabs();renderPanel();return;}
    const mk=t.closest('[data-market]');if(mk){S.market=mk.dataset.market;renderAll();return;}
    const rn=t.closest('[data-run]');if(rn){CFG.params.runWindow=rn.dataset.run;recompute();renderAll();return;}
    if(t.closest('[data-clear-country]')){S.country=null;renderAll();return;}
    const so=t.closest('[data-sort]');if(so){
      const[id,k]=so.dataset.sort.split(':'),cur=S.sort[id];
      S.sort[id]=cur&&cur.k===k?{k,dir:cur.dir==='asc'?'desc':'asc'}:{k,dir:'desc'};renderPanel();return;}
    const tv=t.closest('[data-tview]');if(tv){S.trackerView=tv.dataset.tview;renderPanel();return;}
    const row=t.closest('tr[data-country]');if(row&&S.tab==='country'){S.country=S.country===row.dataset.country?null:row.dataset.country;renderToolbar();renderPanel();return;}
    const lv=t.closest('[data-lview]');if(lv){S.ltvView=lv.dataset.lview;renderPanel();return;}
  });
  document.addEventListener('change',e=>{
    const t=e.target;let ds=t.dataset||{};
    if(t.id==='chk-all'){S.showAll=t.checked;renderAll();return;}
    if(t.id==='f-ltv'){handleLTV(t.files[0]);return;}
  });
}
